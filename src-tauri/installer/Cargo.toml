[workspace]

[package]
name = "compress-io-setup"
version = "0.1.62"
description = "Compress I/O Windows Custom Installer"
edition = "2021"
build = "build.rs"

[dependencies]
brotli = "9.1"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tar = "0.4"
winreg = "0.56"
wry = "0.57"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
brotli = "9.1"
tar = "0.4"
tauri-winres = "0.3"
