name: Release

"on":
  push:
    tags:
      - 'v*'

# ── SECURITY: Remove top-level permissions; define per-job (least privilege) ──
permissions: {}

jobs:
  # Step 1: Create the GitHub release once and attach repository SBOM
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      # 🛡️ SECURITY: Harden GitHub Actions runner against unauthorized network exfiltration
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      # 🛡️ SECURITY: All actions pinned to immutable commit SHAs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 🛡️ SECURITY: Generate official Software Bill of Materials (SBOM in SPDX format)
      - name: Generate Repository SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: compress-io-sbom.spdx.json

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: 'Compress I/O ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: compress-io-sbom.spdx.json
          body: |
            ## Compress I/O ${{ github.ref_name }}

            > **Custom Windows installer, ~87% smaller updates, and silent background staging.**

            ---

            ### ✨ What's New
            - **Custom Frameless Windows Installer:** Replaced the stock NSIS wizard with a bespoke botanical-sage WebView2 setup window featuring custom install location selection, live disk space checks, Explorer right-click integration (`Compress with Compress I/O`), atomic rollback, UAC elevation, full Uninstall cleanup, and headless `/S` + `/P` update support.
            - **Decoupled SHA-256 FFmpeg Runtime Cache:** Moved FFmpeg out of app bundles into a permanent **SHA-256 verified** local cache (`EngineSetupModal`) downloaded once on first run — shrinking the Windows installer from ~51 MiB down to ~6.5 MiB and reducing macOS & Linux update sizes too.
            - **VS Code-Style Silent Background Updater:** Pre-downloads and verifies updates quietly in the background with a non-intrusive `Update` header pill (`DashboardHeader`) and popup-free Windows installation (`installMode: quiet`).
            - **Post-Install "What's New" Release Notes:** Presents release highlights once automatically after installing or upgrading and keeps changelog notes accessible anytime via the clickable header version badge.
            - **Refreshed Studio App Icons:** Updated Windows `.ico`, macOS `.icns`, Linux PNGs, and Windows Store icons to match the botanical forest-sage `I/O` emblem.
            - **Code & Reliability Hardening:** Resolved 27 static-analysis cleanup items across React components and hardened Tauri event listeners.

            ---

            ### 💡 Hybrid Mode & Upgrade Tip
            - **Upgrading from `v0.1.60`:** Triggers a quick one-time FFmpeg runtime check/download into local cache; future updates (`v0.1.61+`) stay tiny and skip re-downloading FFmpeg automatically.
            - **Keep `HYBRID ENGINE` ON (Default)** for fast 4K/HD compression (`NVENC` / `QuickSync` / `AMD VCN` / `VideoToolbox` / `VAAPI` + Dual-Engine batching), or toggle **OFF (`Tuned CPU`)** for exact **Target Size** precision.

            ---

            ### 🔐 Highlights & Security Hardening
            - **SHA-256 Pinned Engine Cache & Sandboxing:** Verifies downloaded FFmpeg runtime archives against pinned SHA-256 hashes and enforces `file,crypto,data,pipe` protocol whitelisting.
            - **Sigstore Cryptographic Attestations & SBOM:** Signed provenance certificates via GitHub OIDC & Sigstore plus `compress-io-sbom.spdx.json`.
            - **Zero Upstream Vulnerabilities:** Audited cleanly across npm and Cargo dependencies.

            ---

            ### 🔐 Verify Binary Authenticity
            You can verify that any downloaded binary was built directly from our GitHub Actions pipeline and hasn't been modified:

            ```bash
            gh attestation verify <downloaded-binary> -R ${{ github.repository }}
            ```

            ---

            ### 📋 Security & Compliance Matrix
            | Layer | Security Standard | Status |
            | :--- | :--- | :---: |
            | **Build Provenance** | Sigstore Cryptographic Attestation | 🔏 SLSA Level 3 |
            | **Transparency** | Software Bill of Materials (SPDX JSON) | 📜 Included |
            | **CI Pipeline** | StepSecurity Kernel Egress Monitoring | 🛡️ Protected |
            | **Engine Sandbox** | SHA-256 Runtime + FFmpeg Protocol Whitelist | 🔐 Hardened |
            | **Dependencies** | Automated `npm audit` + `cargo audit` in CI | 🛡️ 0 Known CVEs |
            | **Workflows** | Immutable 40-Character Commit SHA Pinning | 🔒 Enforced |

            ---

            Built with ❤️ using Tauri v2 + React.

  # Step 2: Build for each platform and upload to the release created above
  build:
    needs: create-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--features cpu --ignore-version-mismatches'
            tauri_script: 'node scripts/build-windows-custom.mjs'
          - platform: macos-15
            args: '--features cpu --ignore-version-mismatches'
            tauri_script: ''
          - platform: ubuntu-22.04
            args: '--features cpu --ignore-version-mismatches'
            tauri_script: ''
          - platform: ubuntu-24.04-arm
            args: '--features cpu --ignore-version-mismatches'
            tauri_script: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # 🛡️ SECURITY: Harden GitHub Actions runner (Linux only — harden-runner doesn't support macOS/Windows)
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install dependencies (Ubuntu only)
        if: contains(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # ── FFmpeg Runtime Decoupled ──────────────────────────────────────────
      # FFmpeg binaries are downloaded once on first run into the user's app-data
      # cache and verified against pinned SHA-256 checksums, keeping installers
      # and in-app updates lightweight across Windows, macOS, and Linux.

      # ─────────────────────────────────────────────────────────────────────

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload to release
        id: tauri-build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          retryAttempts: 5
          tauriScript: ${{ matrix.tauri_script }}
          releaseBody: |
            ## Compress I/O ${{ github.ref_name }}

            > **Custom Windows installer, ~87% smaller updates, and silent background staging.**

            ---

            ### ✨ What's New
            - **Custom Frameless Windows Installer:** Replaced the stock NSIS wizard with a bespoke botanical-sage WebView2 setup window featuring custom install location selection, live disk space checks, Explorer right-click integration (`Compress with Compress I/O`), atomic rollback, UAC elevation, full Uninstall cleanup, and headless `/S` + `/P` update support.
            - **Decoupled SHA-256 FFmpeg Runtime Cache:** Moved FFmpeg out of app bundles into a permanent **SHA-256 verified** local cache (`EngineSetupModal`) downloaded once on first run — shrinking the Windows installer from ~51 MiB down to ~6.5 MiB and reducing macOS & Linux update sizes too.
            - **VS Code-Style Silent Background Updater:** Pre-downloads and verifies updates quietly in the background with a non-intrusive `Update` header pill (`DashboardHeader`) and popup-free Windows installation (`installMode: quiet`).
            - **Post-Install "What's New" Release Notes:** Presents release highlights once automatically after installing or upgrading and keeps changelog notes accessible anytime via the clickable header version badge.
            - **Refreshed Studio App Icons:** Updated Windows `.ico`, macOS `.icns`, Linux PNGs, and Windows Store icons to match the botanical forest-sage `I/O` emblem.
            - **Code & Reliability Hardening:** Resolved 27 static-analysis cleanup items across React components and hardened Tauri event listeners.

            ---

            ### 💡 Hybrid Mode & Upgrade Tip
            - **Upgrading from `v0.1.60`:** Triggers a quick one-time FFmpeg runtime check/download into local cache; future updates (`v0.1.61+`) stay tiny and skip re-downloading FFmpeg automatically.
            - **Keep `HYBRID ENGINE` ON (Default)** for fast 4K/HD compression (`NVENC` / `QuickSync` / `AMD VCN` / `VideoToolbox` / `VAAPI` + Dual-Engine batching), or toggle **OFF (`Tuned CPU`)** for exact **Target Size** precision.

            ---

            ### 🔐 Highlights & Security Hardening
            - **SHA-256 Pinned Engine Cache & Sandboxing:** Verifies downloaded FFmpeg runtime archives against pinned SHA-256 hashes and enforces `file,crypto,data,pipe` protocol whitelisting.
            - **Sigstore Cryptographic Attestations & SBOM:** Signed provenance certificates via GitHub OIDC & Sigstore plus `compress-io-sbom.spdx.json`.
            - **Zero Upstream Vulnerabilities:** Audited cleanly across npm and Cargo dependencies.

            ---

            ### 🔐 Verify Binary Authenticity
            You can verify that any downloaded binary was built directly from our GitHub Actions pipeline and hasn't been modified:

            ```bash
            gh attestation verify <downloaded-binary> -R ${{ github.repository }}
            ```

            ---

            ### 📋 Security & Compliance Matrix
            | Layer | Security Standard | Status |
            | :--- | :--- | :---: |
            | **Build Provenance** | Sigstore Cryptographic Attestation | 🔏 SLSA Level 3 |
            | **Transparency** | Software Bill of Materials (SPDX JSON) | 📜 Included |
            | **CI Pipeline** | StepSecurity Kernel Egress Monitoring | 🛡️ Protected |
            | **Engine Sandbox** | SHA-256 Runtime + FFmpeg Protocol Whitelist | 🔐 Hardened |
            | **Dependencies** | Automated `npm audit` + `cargo audit` in CI | 🛡️ 0 Known CVEs |
            | **Workflows** | Immutable 40-Character Commit SHA Pinning | 🔒 Enforced |

            ---

            Built with ❤️ using Tauri v2 + React.
          args: ${{ matrix.args }}

      # 🛡️ SECURITY: Cryptographic Sigstore provenance attestation for compiled installer bundles
      - name: Attest Build Provenance (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Attest Build Provenance (macOS)
        if: startsWith(matrix.platform, 'macos')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Attest Build Provenance (Linux)
        if: contains(matrix.platform, 'ubuntu')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
