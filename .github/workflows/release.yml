name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Step 1: Create the GitHub release once (not 3x in parallel)
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Compress I/O ${{ github.ref_name }}'
          draft: false
          prerelease: true
          body: |
            ## Compress-IO v0.1.50
            
            High-performance media compression for images and videos — powered by FFmpeg, built with Tauri.

            ---

            ### 🎯 Precision Target Size Engine (2-Pass Encoding)
            We engineered an entirely new algorithmic approach to media compression. You can now toggle "Target Size" to define an exact file size limit in MB or GB. Under the hood, this triggers a highly sophisticated 2-Pass FFmpeg encoding sequence. The first pass maps the complexity of the video, and the second pass mathematically allocates the bitrate to hit your exact size limit perfectly. This is an absolute game-changer for fitting high-quality videos into strict Discord (25MB) or Email (20MB) attachment limits without wasting a single kilobyte.

            ### ✨ The Re-Engineered Success Card
            We completely tore down and rebuilt the completion screen for maximum user experience. The Success Card has been vertically compressed into a much sleeker, modern UI element, meaning you no longer have to manually scroll down to see your results. We injected gorgeous framer-motion physics into the card for a premium feel. Furthermore, the "Show in Folder" integration has been entirely rewritten in Rust to flawlessly bridge the gap between the app and Windows Explorer, ensuring it highlights your freshly compressed file instantly.

            ### 💎 Obsessive UI Polish & Intelligence
            We scrutinize every single pixel of the user experience. In this update:
            - **Intelligent Hardware Warnings:** Added a dynamic, sliding amber warning box that intelligently alerts you when GPU Acceleration might interfere with exact target size precision.
            - **Dropdown Physics:** Rewrote the clipping boundaries of the dropdown menus using strict framer-motion overflow logic, allowing menus to beautifully float above the interface.
            - **Decluttered Interface:** Stripped out arbitrary, hardcoded size presets to provide a vastly cleaner, more professional manual input system.

            | Feature | In v0.1.49 | Now in v0.1.50 |
            | :--- | :--- | :--- |
            | **Compression** | Best-effort size estimation | **Exact mathematical MB/GB targeting** |
            | **Success Card** | Large, required scrolling | **Compact, frictionless, and animated** |
            | **Folder Access** | Broken path navigation | **Native 1-Click Windows Explorer highlight** |
            | **GPU Awareness** | Silent precision loss | **Animated, intelligent slider warnings** |
            | **Security & Dist** | Basic Defaults | **Strict CSP, Hardened IPC & Apple Notarization** |

            ### 🔒 Advanced Security & Distribution
            - **Strict CSP:** Implemented a rigorous Content Security Policy to eliminate XSS vulnerabilities.
            - **Hardened IPC:** Removed dangerous frontend shell execution capabilities and secured file system reads against directory traversal.
            - **macOS Notarization:** Integrated Apple code signing and notarization directly into the release pipeline to satisfy Gatekeeper.

            ---

            Built with ❤️ using Tauri v2 + React.

  # Step 2: Build for each platform and upload to the release created above
  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--features cpu'
          - platform: macos-15
            args: '--features cpu'
          - platform: ubuntu-22.04
            args: '--features cpu'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # ── FFmpeg Auto-Download ──────────────────────────────────────────────

      - name: Download FFmpeg (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          wget -q https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          find . -name "ffmpeg" -type f -not -path "./src-tauri/*" -exec mv {} src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu \;
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu

      - name: Download FFmpeg (macOS)
        if: matrix.platform == 'macos-15'
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
          unzip -o ffmpeg.zip
          find . -name "ffmpeg" -type f -not -path "./src-tauri/*" -exec mv {} src-tauri/binaries/ffmpeg-aarch64-apple-darwin \;
          chmod +x src-tauri/binaries/ffmpeg-aarch64-apple-darwin

      - name: Download FFmpeg (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          curl.exe -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x ffmpeg.zip -y | Out-Null
          $ffmpeg = Get-ChildItem -Recurse -Filter ffmpeg.exe | Where-Object { $_.FullName -notlike "*src-tauri*" } | Select-Object -First 1
          Move-Item -Path $ffmpeg.FullName -Destination src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      # ─────────────────────────────────────────────────────────────────────

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # macOS Code Signing & Notarization
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          releaseBody: |
            ## Compress-IO v0.1.50
            
            High-performance media compression for images and videos — powered by FFmpeg, built with Tauri.

            ---

            ### 🎯 Precision Target Size Engine (2-Pass Encoding)
            We engineered an entirely new algorithmic approach to media compression. You can now toggle "Target Size" to define an exact file size limit in MB or GB. Under the hood, this triggers a highly sophisticated 2-Pass FFmpeg encoding sequence. The first pass maps the complexity of the video, and the second pass mathematically allocates the bitrate to hit your exact size limit perfectly. This is an absolute game-changer for fitting high-quality videos into strict Discord (25MB) or Email (20MB) attachment limits without wasting a single kilobyte.

            ### ✨ The Re-Engineered Success Card
            We completely tore down and rebuilt the completion screen for maximum user experience. The Success Card has been vertically compressed into a much sleeker, modern UI element, meaning you no longer have to manually scroll down to see your results. We injected gorgeous framer-motion physics into the card for a premium feel. Furthermore, the "Show in Folder" integration has been entirely rewritten in Rust to flawlessly bridge the gap between the app and Windows Explorer, ensuring it highlights your freshly compressed file instantly.

            ### 💎 Obsessive UI Polish & Intelligence
            We scrutinize every single pixel of the user experience. In this update:
            - **Intelligent Hardware Warnings:** Added a dynamic, sliding amber warning box that intelligently alerts you when GPU Acceleration might interfere with exact target size precision.
            - **Dropdown Physics:** Rewrote the clipping boundaries of the dropdown menus using strict framer-motion overflow logic, allowing menus to beautifully float above the interface.
            - **Decluttered Interface:** Stripped out arbitrary, hardcoded size presets to provide a vastly cleaner, more professional manual input system.

            | Feature | In v0.1.49 | Now in v0.1.50 |
            | :--- | :--- | :--- |
            | **Compression** | Best-effort size estimation | **Exact mathematical MB/GB targeting** |
            | **Success Card** | Large, required scrolling | **Compact, frictionless, and animated** |
            | **Folder Access** | Broken path navigation | **Native 1-Click Windows Explorer highlight** |
            | **GPU Awareness** | Silent precision loss | **Animated, intelligent slider warnings** |
            | **Security & Dist** | Basic Defaults | **Strict CSP, Hardened IPC & Apple Notarization** |

            ### 🔒 Advanced Security & Distribution
            - **Strict CSP:** Implemented a rigorous Content Security Policy to eliminate XSS vulnerabilities.
            - **Hardened IPC:** Removed dangerous frontend shell execution capabilities and secured file system reads against directory traversal.
            - **macOS Notarization:** Integrated Apple code signing and notarization directly into the release pipeline to satisfy Gatekeeper.

