name: OpenSSF Scorecard

"on":
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1' # Runs weekly on Monday at 01:30 UTC
  push:
    branches: [ "main" ]
  workflow_dispatch:

# ── SECURITY: Drop all default permissions; grant only minimal needed ──
permissions: read-all

jobs:
  analysis:
    name: Scorecard Supply Chain Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to GitHub's code scanning dashboard
      security-events: write
      # Needed to publish results and claim the OpenSSF Scorecard badge
      id-token: write
      contents: read
      actions: read

    steps:
      # 🛡️ SECURITY: Harden GitHub Actions runner against unauthorized network exfiltration
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      # 🛡️ SECURITY: Pinned to immutable commit SHA
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: true

      # Upload the results to GitHub's code scanning dashboard
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: results.sarif
