name: OpenSSF Scorecard

"on":
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1' # Runs weekly on Monday at 01:30 UTC
  push:
    branches: [ "main" ]
  workflow_dispatch:

# ── SECURITY: Drop all default permissions; grant only minimal needed ──
permissions: read-all

jobs:
  analysis:
    name: Scorecard Supply Chain Analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to GitHub's code scanning dashboard
      security-events: write
      # Needed to publish results and claim the OpenSSF Scorecard badge
      id-token: write
      contents: read
      actions: read

    steps:
      # 🛡️ SECURITY: Harden GitHub Actions runner against unauthorized network exfiltration
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      # 🛡️ SECURITY: Pinned to immutable commit SHA
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: true

      # Upload the results to GitHub's code scanning dashboard
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
