name: CI Verification

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Minimal top-level permissions (least privilege)
permissions: {}

jobs:
  test-build:
    name: Build & Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 🛡️ SECURITY: Harden GitHub Actions runner against unauthorized network exfiltration
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      # 🛡️ SECURITY: All actions pinned to immutable commit SHAs
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 🛡️ SECURITY: Audit npm dependencies for known CVEs
      - name: Frontend security audit check
        run: npm audit --audit-level=high

      # 🛡️ SECURITY: Install prebuilt cargo-audit binary in seconds (no source compilation)
      - name: Install cargo-audit
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-audit

      # 🛡️ SECURITY: Audit Rust backend crates for known security advisories natively via CLI
      - name: Rust security audit check
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0372 --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0543

      - name: Build frontend bundle
        run: npm run build
