name: CI Verification

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Minimal permissions for testing
permissions:
  contents: read
  checks: write

jobs:
  test-build:
    name: Build & Security Audit
    runs-on: ubuntu-latest

    steps:
      # 🛡️ SECURITY: Harden GitHub Actions runner against unauthorized network exfiltration
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit

      # 🛡️ SECURITY: All actions pinned to immutable commit SHAs
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 🛡️ SECURITY: Audit npm dependencies for known CVEs
      - name: Frontend security audit check
        run: npm audit --audit-level=high

      # 🛡️ SECURITY: Audit Rust backend crates for known security advisories
      - name: Rust security audit check
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

      - name: Build frontend bundle
        run: npm run build
